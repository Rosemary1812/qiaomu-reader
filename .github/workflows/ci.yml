name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:i18n
      - run: npm run build
      - run: npm run verify:release
      - run: npx eslint src/ --max-warnings=0
      - name: Verify committed build artifact
        run: |
          ok=1
          for name in main.js styles.css; do
            if ! git show "HEAD:$name" | cmp -s - "$name"; then
              echo "$name differs from the committed build artifact"
              ok=0
            fi
          done
          test "$ok" = 1
      - name: Verify community candidate excludes the ACP installer
        run: npm run build:community
